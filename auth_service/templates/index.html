<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auth - Cadastro e Login</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 24px auto; padding: 0 12px; }
    h1 { font-size: 1.1rem; }
    section { border: 1px solid #ccc; padding: 12px; margin-bottom: 14px; }
    label { display: block; margin-top: 8px; font-size: 0.85rem; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 2px; }
    button { margin-top: 10px; padding: 6px 12px; cursor: pointer; }
    .toggle { text-align: center; margin-top: 10px; }
    .toggle a { color: blue; text-decoration: none; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Auth  Cadastro e Login</h1>
  <p>Para acessar, você deve se cadastrar. Se já tem conta, faça login.</p>

  <div id="register-section">
    <section>
      <strong>Cadastro</strong>
      <form action="/auth/register" method="post">
        <label>email <input name="email" type="email" required></label>
        <label>nome <input name="name" type="text"></label>
        <label>senha <input name="password" type="password" required></label>
        <button type="submit">Registrar</button>
      </form>
      <div class="toggle">
        <a href="#" id="show-login">Já tem conta? Faça login</a>
      </div>
    </section>
  </div>

  <div id="login-section" class="hidden">
    <section>
      <strong>Login</strong>
      <form action="/auth/login" method="post">
        <label>email <input name="email" type="email" required></label>
        <label>senha <input name="password" type="password" required></label>
        <button type="submit">Entrar</button>
      </form>
      <div class="toggle">
        <a href="#" id="show-register">Não tem conta? Cadastre-se</a>
      </div>
    </section>
  </div>

  <script>
    document.getElementById("show-login").addEventListener("click", function(e) {
      e.preventDefault();
      document.getElementById("register-section").classList.add("hidden");
      document.getElementById("login-section").classList.remove("hidden");
    });

    document.getElementById("show-register").addEventListener("click", function(e) {
      e.preventDefault();
      document.getElementById("login-section").classList.add("hidden");
      document.getElementById("register-section").classList.remove("hidden");
    });
  </script>
</body>
</html>
